name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '90' }}

jobs:
  detect-components:
    name: Detect Scaffolds & Validate Governance
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.detect.outputs.has_backend }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect present project components
        id: detect
        run: |
          if [ -f "backend/pyproject.toml" ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/pyproject.toml not found; backend CI jobs will skip until Phase 1 scaffolding."
          fi

          if [ -f "frontend/package.json" ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not found; frontend CI job will skip until Phase 1 scaffolding."
          fi

          if [ -f "docker-compose.yml" ] && [ -f "backend/Dockerfile" ] && [ -f "frontend/Dockerfile" ]; then
            echo "has_docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_docker=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker manifests not found; docker-verify job will skip until Phase 1 scaffolding."
          fi

      - name: Validate workflow YAML syntax and required documentation
        run: |
          python3 -c "
          import glob, pathlib, sys, yaml

          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, 'r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f'Valid YAML: {path}')

          required_docs = [
              'README.md',
              'docs/PRD.md',
              'docs/ARCHITECTURE.md',
              'docs/RULES.md',
              'docs/DESIGN.md',
              'docs/TASKS.md',
              'docs/MEMORY.md',
              '.github/PULL_REQUEST_TEMPLATE.md',
          ]
          missing = [p for p in required_docs if not pathlib.Path(p).is_file() or pathlib.Path(p).stat().st_size == 0]
          if missing:
              print(f'Missing or empty required docs: {missing}', file=sys.stderr)
              sys.exit(1)
          print('All required baseline docs verified.')
          "

  backend-lint:
    name: Backend Lint & Format (Ruff)
    needs: detect-components
    if: needs.detect-components.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  backend-typecheck:
    name: Backend Strict Type Checking (Mypy)
    needs: [detect-components, backend-lint]
    if: needs.detect-components.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and type dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Mypy strict type check
        run: mypy --strict app

  frontend-quality:
    name: Frontend Lint, Typecheck & Vitest
    needs: detect-components
    if: needs.detect-components.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vue TypeScript typecheck
        run: npx vue-tsc --noEmit

      - name: Run Vitest unit tests
        run: npx vitest run

  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    needs: [detect-components, backend-lint, backend-typecheck]
    if: needs.detect-components.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailmaster_test
          POSTGRES_PASSWORD: mailmaster_test_password
          POSTGRES_DB: mailmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mailmaster_test -d mailmaster_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://mailmaster_test:mailmaster_test_password@localhost:5432/mailmaster_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-only-jwt-secret-key-at-least-32-chars
      ENCRYPTION_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run Pytest with branch coverage
        run: |
          pytest ../tests \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under="${COVERAGE_THRESHOLD}"

      - name: Upload coverage XML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: backend/coverage.xml
          retention-days: 14

  security-audit:
    name: Security Audit (Bandit & pip-audit)
    needs: [detect-components, backend-lint]
    if: needs.detect-components.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"

      - name: Run Bandit static security scan
        run: bandit -r app -ll -ii

      - name: Run pip-audit dependency vulnerability scan
        run: pip-audit

  docker-verify:
    name: Docker Build & Compose Validation
    needs: [detect-components, backend-lint, backend-typecheck, frontend-quality, backend-test, security-audit]
    if: needs.detect-components.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Verify backend Docker image build (no push)
        run: docker build --file backend/Dockerfile --tag mailmaster-backend:ci backend

      - name: Verify frontend Docker image build (no push)
        run: docker build --file frontend/Dockerfile --tag mailmaster-frontend:ci frontend
